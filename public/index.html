<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinAssistant — Agentic Requirements Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#151b26;--ink-soft:#4b5563;--paper:#f4f2ec;--panel:#fff;--line:#dcd8cc;--accent:#2f5d73;--accent-soft:#e2ebee;--amber:#a8722e;--amber-soft:#f4e9d8;--red:#9a4436;--red-soft:#f3e2dd;--green:#3c6e4a;--green-soft:#e2ecdf;--radius:8px;--shadow:0 1px 2px rgba(20,20,10,.05),0 4px 14px rgba(20,20,10,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#eceae3;--ink-soft:#a9a79c;--paper:#161a20;--panel:#1d222a;--line:#333a44;--accent:#7fb2c9;--accent-soft:#23323a;--amber:#d7a35f;--amber-soft:#332a1a;--red:#e08d7c;--red-soft:#3a2420;--green:#8fc79f;--green-soft:#1e2c21}}
:root[data-theme=dark]{--ink:#eceae3;--ink-soft:#a9a79c;--paper:#161a20;--panel:#1d222a;--line:#333a44;--accent:#7fb2c9;--accent-soft:#23323a;--amber:#d7a35f;--amber-soft:#332a1a;--red:#e08d7c;--red-soft:#3a2420;--green:#8fc79f;--green-soft:#1e2c21}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
body:not(.authenticated)>header,body:not(.authenticated)>main{display:none}
.authenticated .auth-screen{display:none}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
.auth-screen{width:min(440px,calc(100% - 32px));margin:10vh auto 0;padding:28px}
.mark{width:34px;height:4px;border-radius:2px;background:var(--accent)}
.kicker{color:var(--accent);font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h1,h2,h3{margin:0;font-family:"Source Serif 4",Georgia,serif;font-weight:600}
.auth-screen h2{margin:8px 0;font-size:1.45rem}
.auth-screen p,.tagline{color:var(--ink-soft);font-size:.88rem}
label{display:block;margin:12px 0 5px;font-size:.82rem;font-weight:600}
input,textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);font:inherit;font-size:.88rem;padding:10px}
textarea{resize:vertical}
.auth-screen input{font-size:.9rem}
.auth-error{min-height:1.4em;margin-top:10px;color:var(--red);font-size:.82rem}
.auth-toggle{border:0;background:none;color:var(--accent);font:inherit;padding:8px 0;cursor:pointer}
.hint,.step-desc{color:var(--ink-soft);font-size:.78rem}
header{position:relative;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding:calc(30px + env(safe-area-inset-top,0px)) clamp(16px,4vw,40px) 24px}
header h1{font-size:2.15rem;line-height:1;letter-spacing:-.02em}
header .tagline{max-width:640px;margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1rem;font-style:italic}
.account-bar{position:absolute;top:24px;right:clamp(16px,4vw,40px);display:flex;align-items:center}
.theme-toggle,.account-avatar{display:grid;width:38px;height:38px;place-items:center;border:1px solid var(--line);border-radius:50%;cursor:pointer}
.theme-toggle{margin-right:10px;background:var(--panel);color:var(--ink)}
.theme-toggle svg{width:18px;height:18px}
.account-menu{position:relative}
.account-avatar{background:var(--accent);color:var(--panel);font-weight:600}
.account-popover{position:absolute;z-index:20;top:calc(100% + 10px);right:0;width:min(280px,calc(100vw - 32px));padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
.account-popover[hidden]{display:none}
.account-email{overflow-wrap:anywhere;margin-bottom:12px;font-size:.82rem}
.workspace{max-width:1440px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 60px;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:24px}
.workspace-side,.workspace-main{min-width:0}
.workspace-card{margin-bottom:16px;padding:20px}
.workspace-card h2{margin-bottom:10px;font-size:1.05rem}
.workspace-card textarea{min-height:110px}
.run-btn,.small-btn,.tab,.kb-filter,.review-actions button{font:inherit;cursor:pointer}
.run-btn{width:100%;margin-top:12px;border:0;border-radius:var(--radius);background:var(--accent);color:var(--panel);padding:11px 14px;font-weight:600}
.run-btn:disabled{opacity:.55;cursor:not-allowed}
.small-btn{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:6px 10px;font-size:.78rem}
.small-btn:hover,.tab:hover{border-color:var(--accent)}
.project-chat{display:flex;min-height:260px;max-height:58vh;flex-direction:column;gap:12px;overflow:auto;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}
.chat-message{max-width:90%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere}
.chat-message.user{align-self:flex-end;border-color:transparent;background:var(--accent-soft)}
.chat-message.assistant{align-self:flex-start}
.chat-composer{display:flex;align-items:flex-end;gap:8px;margin-top:10px}
.chat-composer textarea{min-height:54px;max-height:180px;resize:vertical}
.chat-composer .run-btn{width:auto;min-width:95px;margin:0}
.source-list,.history-list{display:grid;gap:8px;margin-top:10px}
.source-card,.history-card{border:1px solid var(--line);border-radius:6px;padding:10px;font-size:.79rem;overflow-wrap:anywhere}
.source-card p{margin:5px 0}
.history-card{display:flex;align-items:center;justify-content:space-between;gap:8px}
.history-actions{display:flex;gap:6px}
.intro-content{min-height:420px;padding:clamp(22px,4vw,38px)}
.intro-content h2{margin:5px 0 8px;font-size:1.45rem}
.intro-content>p{color:var(--ink-soft);font-size:.88rem}
.agent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:22px 0}
.agent-card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--panel)}
.agent-card strong{display:block;font-size:.82rem}
.agent-card span{display:block;margin-top:4px;color:var(--ink-soft);font-size:.74rem}
.stage-list{display:grid;gap:5px;margin-bottom:14px;padding:14px 18px}
.stage-item{padding:8px 10px;border-radius:6px;color:var(--ink-soft);font-size:.82rem}
.stage-item.active{background:var(--accent-soft);color:var(--ink);font-weight:600}
.stage-item.done{color:var(--green)}
.stage-item.waiting{background:var(--amber-soft);color:var(--amber);font-weight:600}
.stage-item.failed{background:var(--red-soft);color:var(--red);font-weight:600}
.pipeline-error{margin:14px 0;padding:12px;border-radius:var(--radius);background:var(--red-soft);color:var(--red)}
.clarify-panel{margin:16px 0;padding:16px;border:1px solid var(--amber);border-radius:var(--radius);background:var(--amber-soft)}
.clarify-panel h3{margin-bottom:6px}
.clarification-row{margin:12px 0}
.clarification-row label{font-size:.84rem}
.clarify-answer{min-height:70px}
.results{margin-bottom:14px;padding:20px;overflow:auto}
.results h2{margin-bottom:10px;font-size:1.3rem}
.results h3{margin:20px 0 8px;font-size:1rem}
.archive-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.archive-bar strong{margin-right:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 0}
.tab{border:1px solid var(--line);border-radius:6px;padding:8px 11px;background:var(--panel);color:var(--ink);font-size:.8rem}
.tab.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.results table{width:100%;border-collapse:collapse;font-size:.8rem}
.results th,.results td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.results th{color:var(--ink-soft);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase}
.results ul{padding-left:22px}
.results li{margin:4px 0}
.result-card{margin:10px 0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);font-size:.84rem;overflow-wrap:anywhere}
.result-card p{margin:5px 0;color:var(--ink-soft)}
.evidence-chip,.badge{display:inline-block;margin:4px 4px 0 0;padding:2px 7px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:.7rem}
.approval-banner{margin:14px 0;padding:14px;border:1px solid var(--amber);border-radius:var(--radius);background:var(--amber-soft)}
.review-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.review-actions button{border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);padding:4px 7px;font-size:.7rem}
.kb-filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.kb-filter{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);padding:4px 10px;font-size:.73rem}
.kb-item{margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:var(--radius)}
.kb-item p{color:var(--ink-soft);font-size:.82rem;white-space:pre-wrap}
.kb-meta{color:var(--ink-soft);font-size:.7rem}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.workspace-side{order:2}.workspace-main{order:1}.project-chat{max-height:42vh}}
@media(max-width:640px){header{padding-top:76px}.account-bar{top:18px}.workspace{padding-top:18px}.archive-bar{align-items:flex-start}}
/* Requirements Studio shell */
:root{--ink:#191a1d;--ink-soft:#777a80;--paper:#f8f8f8;--panel:#fff;--line:#e7e7e8;--accent:#18191c;--accent-soft:#f0f0f1;--amber:#a66b00;--amber-soft:#fff5df;--red:#bd4552;--red-soft:#fff0f1;--green:#39794b;--green-soft:#eaf5ed;--radius:10px;--shadow:0 1px 2px rgba(0,0,0,.03),0 4px 14px rgba(0,0,0,.025)}
:root[data-theme=dark]{--ink:#f1f1f2;--ink-soft:#a3a4aa;--paper:#161719;--panel:#202124;--line:#333438;--accent:#f1f1f2;--accent-soft:#303135;--amber:#e6b24e;--amber-soft:#3b301b;--red:#ef818d;--red-soft:#3d2327;--green:#82c994;--green-soft:#203529}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f1f1f2;--ink-soft:#a3a4aa;--paper:#161719;--panel:#202124;--line:#333438;--accent:#f1f1f2;--accent-soft:#303135;--amber:#e6b24e;--amber-soft:#3b301b;--red:#ef818d;--red-soft:#3d2327;--green:#82c994;--green-soft:#203529}}
body{min-height:100vh;background:var(--paper);font-family:"IBM Plex Sans",Arial,sans-serif;font-size:14px}
h1,h2,h3{font-family:"IBM Plex Sans",Arial,sans-serif}
body:not(.authenticated)>.app-shell{display:none}
.app-shell{display:grid;min-height:100vh;grid-template-columns:228px minmax(0,1fr)}
.app-sidebar{position:sticky;top:0;display:flex;height:100vh;min-height:560px;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);padding:22px 12px 14px}
.brand{padding:0 6px 20px}
.brand .kicker{color:var(--ink-soft);font-size:.64rem;letter-spacing:.13em}
.brand h1{margin-top:5px;font-size:1.04rem;letter-spacing:-.02em}
.project-picker{margin:0 0 16px;padding:0 1px}
.project-picker-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;padding:0 3px}
.project-picker label{margin:0;color:var(--ink-soft);font-size:.63rem;letter-spacing:.09em;text-transform:uppercase}
.project-picker select{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:.75rem;padding:0 8px}
.new-project-btn{border:0;border-radius:20px;background:var(--ink);color:var(--panel);font:inherit;font-size:.65rem;font-weight:600;padding:5px 9px;cursor:pointer}
.sidebar-nav{display:grid;gap:3px}
.nav-item{display:flex;width:100%;min-height:34px;align-items:center;gap:9px;border:0;border-radius:7px;background:transparent;color:var(--ink-soft);font:inherit;font-size:.78rem;text-align:left;padding:7px 9px;cursor:pointer}
.nav-item:hover{background:var(--paper);color:var(--ink)}
.nav-item.active{background:var(--ink);color:var(--panel)}
.nav-icon{width:16px;text-align:center;font-size:.85rem}
.nav-badge{margin-left:auto;border-radius:20px;background:var(--paper);color:var(--ink-soft);font-size:.62rem;padding:1px 6px}
.nav-item.active .nav-badge{background:rgba(255,255,255,.16);color:var(--panel)}
.sidebar-section{display:flex;min-height:0;flex-direction:column;margin-top:19px;border-top:1px solid var(--line);padding:14px 3px 0}
.sidebar-section-title{margin:0 0 8px;color:var(--ink-soft);font-size:.65rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sidebar-history{min-height:20px;max-height:240px;overflow:auto}
.sidebar-history .history-card{display:block;border:0;padding:5px 2px;font-size:.72rem}
.sidebar-history .history-card>span:first-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-history .history-card>span:first-child .hint{display:none}
.sidebar-history .history-actions{margin-top:4px}
.sidebar-history .history-actions button{padding:3px 6px;font-size:.64rem}
.chat-sources{margin-top:13px;border-top:1px solid var(--line);padding-top:10px}
.chat-sources summary{color:var(--ink-soft);font-size:.72rem;font-weight:600;cursor:pointer}
.chat-sources[open]{max-height:230px;overflow:auto}
.chat-sources label{font-size:.72rem}
.chat-sources textarea{min-height:66px}
.chat-sources .small-btn{margin-top:7px}
.source-list{max-height:120px;overflow:auto}
.app-main{min-width:0}
.topbar{position:sticky;z-index:5;top:0;display:flex;height:62px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--panel);padding:0 clamp(20px,4vw,48px)}
.topbar-context{overflow:hidden;color:var(--ink-soft);font-size:.74rem;text-overflow:ellipsis;white-space:nowrap}
.topbar-context strong{color:var(--ink);font-weight:600}
.account-bar{position:relative;top:auto;right:auto;display:flex;align-items:center}
.theme-toggle,.account-avatar{width:34px;height:34px}
.theme-toggle{margin-right:8px}
.account-avatar{background:var(--ink);color:var(--panel)}
.page-content{width:min(1120px,100%);margin:0 auto;padding:34px clamp(20px,4vw,48px) 60px}
.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-heading h2{font-size:1.42rem;letter-spacing:-.035em}
.page-heading p{display:none}
.status-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink-soft);font-size:.68rem;padding:5px 10px;white-space:nowrap}
.status-pill.needs-review{border-color:#f1d8dd;background:var(--red-soft);color:var(--red)}
.status-pill.approved{border-color:#d6e8da;background:var(--green-soft);color:var(--green)}
.overview-dashboard{display:grid;grid-template-columns:minmax(230px,.72fr) minmax(0,1.5fr);align-items:stretch;gap:34px;margin-top:28px}
.overview-feature{display:flex;min-height:330px;flex-direction:column;align-items:flex-start;justify-content:center;border-radius:12px;background:var(--ink);color:var(--panel);padding:28px}
.feature-eyebrow{color:var(--ink-soft);font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.overview-feature h3{margin-top:18px;font-size:clamp(1.45rem,2.7vw,2.25rem);letter-spacing:-.05em;line-height:1.12;overflow-wrap:anywhere}
.overview-feature p{margin:12px 0 0;color:var(--ink-soft);font-size:.78rem;line-height:1.65}
.feature-link{margin-top:24px;border:0;border-bottom:1px solid currentColor;background:transparent;color:var(--panel);font:inherit;font-size:.75rem;padding:0 0 4px;cursor:pointer}
.feature-link span{margin-left:7px}
.overview-ledger{min-width:0}
.ledger-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:4px 2px 13px}
.ledger-heading h3{font-size:.9rem}
.ledger-heading span{color:var(--ink-soft);font-size:.68rem}
.ledger-rows{display:grid}
.ledger-row{display:grid;width:100%;grid-template-columns:minmax(120px,1fr) minmax(80px,.7fr) minmax(150px,1.5fr) 20px;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;padding:17px 4px;cursor:pointer}
.ledger-row:hover{background:var(--accent-soft)}
.ledger-label{font-size:.76rem;font-weight:600}
.ledger-value{font-size:1.2rem;letter-spacing:-.04em;overflow-wrap:anywhere}
.ledger-note{color:var(--ink-soft);font-size:.68rem}
.ledger-arrow{color:var(--ink-soft);font-size:.85rem}
.dashboard-actions{display:flex;gap:8px;margin-top:18px}
.dashboard-actions .small-btn{padding:8px 12px}
.primary-dark{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.overview-review{margin-top:18px}
.page-panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:18px}
.elicitation-grid{display:grid;grid-template-columns:minmax(0,1fr);align-items:start;gap:16px}
.chat-panel{padding:14px}
.chat-panel-heading{margin:0 0 10px;font-size:.82rem}
.project-chat{min-height:280px;max-height:54vh;gap:10px;border:0;background:var(--panel);padding:7px 4px;scrollbar-color:#bbb transparent}
.chat-message{max-width:92%;border-radius:9px;font-size:.78rem;line-height:1.55;padding:11px 13px}
.chat-message.user{background:var(--ink);color:var(--panel)}
.chat-composer textarea{min-height:56px;background:var(--panel);font-size:.78rem}
.chat-composer .run-btn{min-width:68px}
.run-btn{background:var(--ink);color:var(--panel);font-size:.78rem}
.chat-actions{display:flex;align-items:center;gap:12px;margin-top:9px}
.chat-actions .run-btn{width:auto;margin:0;padding:8px 12px}
.chat-actions .hint{flex:1}
.brief-form{margin:8px 0 12px;border-bottom:1px solid var(--line);padding:4px 4px 14px}
.brief-form label{margin-top:8px;font-size:.73rem}
.brief-form textarea{min-height:110px;font-size:.78rem}
.brief-form .run-btn{width:auto;padding:8px 12px}
.brief-summary{margin:0 3px 8px;border-bottom:1px solid var(--line);padding:0 0 9px}
.brief-summary summary{color:var(--ink-soft);font-size:.7rem;font-weight:600;cursor:pointer}
.brief-summary label{font-size:.7rem}
.brief-summary input,.brief-summary textarea{font-size:.75rem}
.brief-summary textarea{min-height:56px}
.side-info-card{margin-bottom:11px;padding:15px}
.side-info-card h3{margin-bottom:6px;font-size:.8rem}
.side-info-card p{margin:0;color:var(--ink-soft);font-size:.7rem}
.side-info-card .info-value{color:var(--ink);font-size:.75rem}
.clarify-panel{margin:0;padding:14px;border:1px solid var(--line);background:var(--panel)}
.quality-subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.quality-subnav .tab{font-size:.72rem}
.results{padding:18px}
.empty-page h3{margin:0 0 5px;font-size:.9rem}
.empty-page p{margin:0 0 12px}
.results h2{font-size:1.08rem}
.results h3{font-size:.88rem}
.archive-bar{margin-bottom:12px}
.archive-bar strong{font-size:.9rem}
.result-card{background:var(--panel)}
.stage-list{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding:10px}
.stage-item{font-size:.7rem}
.auth-screen{margin-top:12vh}
@media(max-width:900px){.app-shell{grid-template-columns:190px minmax(0,1fr)}.app-sidebar{padding-inline:9px}.overview-dashboard{grid-template-columns:minmax(180px,.7fr) minmax(0,1.3fr);gap:20px}.overview-feature{min-height:300px;padding:22px}.ledger-row{grid-template-columns:minmax(95px,1fr) minmax(65px,.6fr) minmax(110px,1.3fr) 16px;gap:8px}.elicitation-grid{grid-template-columns:minmax(0,1fr)}.sidebar-history{max-height:110px}}
@media(max-width:640px){.app-shell{display:block}.app-sidebar{position:sticky;z-index:8;top:0;height:auto;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px}.brand,.project-picker,.sidebar-section{display:none}.sidebar-nav{display:flex;gap:5px;overflow-x:auto;padding:1px 0;scrollbar-width:none}.sidebar-nav::-webkit-scrollbar{display:none}.nav-item{width:auto;min-width:max-content;min-height:32px;padding:6px 9px;font-size:.7rem}.nav-icon{display:none}.topbar{height:48px;padding:0 14px}.page-content{padding:22px 14px 40px}.page-heading{margin-bottom:17px}.page-heading h2{font-size:1.2rem}.overview-dashboard{grid-template-columns:minmax(0,1fr);gap:20px;margin-top:20px}.overview-feature{min-height:210px;padding:22px}.overview-feature h3{margin-top:10px;font-size:1.55rem}.ledger-row{grid-template-columns:minmax(100px,1fr) auto 18px;gap:8px;padding:13px 3px}.ledger-note{grid-column:1/3;grid-row:2}.ledger-arrow{grid-column:3;grid-row:1/3}.chat-panel{padding:10px}.project-chat{min-height:220px;max-height:46vh}.dashboard-actions{flex-wrap:wrap}.archive-bar{gap:6px}.archive-bar .hint{width:100%}}
</style>
</head>
<body>
<section class="panel auth-screen" id="authScreen" aria-labelledby="authTitle">
  <div class="mark"></div>
  <div class="kicker">Agentic Requirements Platform</div>
  <h2 id="authTitle">Sign in to FinAssistant</h2>
  <p id="authDescription">Your project workspace and saved analyses are private to your account.</p>
  <form id="authForm">
    <div id="authUsernameRow" hidden>
      <label for="authUsername">Username</label>
      <input id="authUsername" name="username" type="text" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9._\-]{3,30}">
      <div class="hint">3–30 characters; letters, numbers, dots, underscores or hyphens.</div>
    </div>
    <label for="authEmail" id="authIdentityLabel">Username or email</label>
    <input id="authEmail" name="identity" type="text" autocomplete="username" maxlength="254" required>
    <label for="authPassword">Password</label>
    <input id="authPassword" name="password" type="password" autocomplete="current-password" required>
    <button class="run-btn" id="authSubmit" type="submit">Sign in</button>
    <div class="auth-error" id="authError" role="alert"></div>
  </form>
  <button class="auth-toggle" id="authToggle" type="button">Create an account</button>
</section>
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="brand">
      <h1>FinAssistant</h1>
    </div>
    <section class="project-picker">
      <div class="project-picker-top">
        <label for="projectSelector">Project</label>
        <button class="new-project-btn" id="newProjectTop" type="button">+ New</button>
      </div>
      <select id="projectSelector" aria-label="Select a saved project">
        <option value="">Current project</option>
      </select>
    </section>
    <nav class="sidebar-nav" aria-label="Requirements workspace">
      <button class="nav-item active" data-page="Overview" type="button"><span class="nav-icon">◫</span>Overview</button>
      <button class="nav-item" data-page="Chat" type="button"><span class="nav-icon">◌</span>Chat</button>
      <button class="nav-item" data-page="Requirements" type="button"><span class="nav-icon">☷</span>Requirements<span class="nav-badge" id="requirementsBadge"></span></button>
      <button class="nav-item" data-page="Quality, Compliance &amp; Risk" type="button"><span class="nav-icon">◇</span>Quality, Compliance &amp; Risk<span class="nav-badge" id="qualityBadge"></span></button>
      <button class="nav-item" data-page="SDLC &amp; Workflow" type="button"><span class="nav-icon">⌘</span>SDLC &amp; Workflow</button>
      <button class="nav-item" data-page="SRS Documentation" type="button"><span class="nav-icon">▤</span>SRS Documentation</button>
      <button class="nav-item" data-page="Knowledge Base" type="button"><span class="nav-icon">⌕</span>Knowledge Base</button>
    </nav>
    <section class="sidebar-section">
      <h2 class="sidebar-section-title">Saved analyses</h2>
      <div id="historyList" class="history-list sidebar-history">Loading…</div>
    </section>
  </aside>
  <main class="app-main">
    <div class="topbar">
      <div class="topbar-context"><strong id="topbarProject">FinAssistant</strong><span id="topbarProjectName"></span></div>
      <div class="account-bar">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        </button>
        <div class="account-menu">
          <button class="account-avatar" id="accountMenuToggle" type="button" aria-label="Open account menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="accountPopover"></button>
          <div class="account-popover" id="accountPopover" role="dialog" aria-label="Account details" hidden>
            <div class="account-email" id="accountEmail"></div>
            <button class="small-btn" id="signOutBtn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </div>
    <section id="content" class="page-content"></section>
  </main>
</div>
<script src="/app.js" defer></script>
</body>
</html>
